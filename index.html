<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>ProfeGo</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7fbff}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="/index-app.html?v=10"></iframe><script>if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));caches&&caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument;['/visual-v2.css?v=10','/layout-hotfix.css?v=10','/design-match.css?v=10'].forEach(h=>{const l=d.createElement('link');l.rel='stylesheet';l.href=h;d.head.appendChild(l)});['/theme-customizer.js?v=10','/scene-enhancer.js?v=10'].forEach(src=>{const s=d.createElement('script');s.src=src;d.body.appendChild(s)});const clean=()=>{[...d.querySelectorAll('*')].forEach(el=>{const t=(el.textContent||'').trim();if((t.startsWith('Salvavidas')||t.startsWith('Tip del día'))&&!el.closest('.sidebar')){const c=el.closest('.rescue-card,.tip-card,.sidecard,.home-right,[class*=rescue],[class*=tip]')||el;if(c&&c!==d.body&&c!==d.documentElement)c.style.display='none'}})};clean();new MutationObserver(clean).observe(d.body,{childList:true,subtree:true})}catch(e){console.error(e)}})</script></body></html>
