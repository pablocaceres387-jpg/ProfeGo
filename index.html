<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>ProfeGo</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7fbff}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="/index-app.html?v=8"></iframe><script>if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));caches&&caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument;const link=d.createElement('link');link.rel='stylesheet';link.href='/visual-v2.css?v=8';d.head.appendChild(link);const link2=d.createElement('link');link2.rel='stylesheet';link2.href='/layout-hotfix.css?v=8';d.head.appendChild(link2);const s=d.createElement('script');s.src='/theme-customizer.js?v=8';d.body.appendChild(s);const se=d.createElement('script');se.src='/scene-enhancer.js?v=8';d.body.appendChild(se);const clean=()=>{[...d.querySelectorAll('*')].forEach(el=>{const t=(el.textContent||'').trim();if((t.startsWith('Salvavidas')||t.startsWith('Tip del día'))&&!el.closest('.sidebar')){const c=el.closest('.rescue-card,.tip-card,.sidecard,.home-right,[class*=rescue],[class*=tip]')||el;if(c&&c!==d.body&&c!==d.documentElement)c.style.display='none'}});const home=d.querySelector('#page-home');if(home){const grids=home.querySelectorAll('.home-grid,.dashboard-grid,.home-layout');grids.forEach(g=>{g.style.gridTemplateColumns='minmax(0,1fr)';g.style.width='100%'})}};clean();new MutationObserver(clean).observe(d.body,{childList:true,subtree:true})}catch(e){console.error(e)}})</script></body></html>
